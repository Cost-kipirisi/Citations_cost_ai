<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citations du jour</title>

    <link rel="stylesheet" href="lestyle.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="background-animation"></div>

    <div class="container">

        <h1 class="title">
            ✨ Citations du jour
        </h1>

        <p class="subtitle">
            Sagesse • Motivation • Bible • Philosophie
        </p>

        <div class="quote-box">

            <div class="quote-icon">❝</div>

            <p id="quote">
                Clique sur le bouton pour générer une citation...
            </p>

            <h3 id="author">
                — Cost AI
            </h3>

        </div>

        <div class="buttons">

            <button id="generateBtn">
                Générer une citation
            </button>

            <button id="copyBtn">
                Copier
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
